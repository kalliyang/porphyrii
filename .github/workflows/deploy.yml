name: Test

# Cloudflare deployment credentials were removed from GitHub Actions on
# 2026-08-21. CI is test-only. Authorized deployments are initiated locally
# through the lab's fail-closed Keychain-backed wrapper after a separate
# release decision.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (text-integrity, precheck, contract)
        run: node --test
